<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="WIDTH=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/dist/index.css" />
    <title>Quiz App</title>
  </head>
  <body>
    <nav class="flex justify-between bg-[#343A40] px-8 py-3">
      <div class="logo flex items-center gap-5">
        <img src="https://phone-shop.netlify.app/static/media/logo.5ba631a7.svg" width="40" alt="" />
        <h3 class="text-white">Products</h3>
      </div>
      <button class="cart rounded-md bg-blue-700 px-4 py-2 text-white">My Cart</button>
    </nav>

    <div class="max-w-6xl mx-auto header">
      <h1 class="text-3xl font-bold text-center mb-4 mt-2">Phone Shop</h1>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-1.png" alt="Google Pixel Black" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">Google Pixel - Black</h2>
              <p class="text-blue-500 text-lg font-bold">$699</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>

          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-2.png" alt="Samsung S7" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">Samsung S7</h2>
              <p class="text-blue-500 text-lg font-bold">$599</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>

          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-3.png" alt="HTC 10 Black" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">HTC 10 - Black</h2>
              <p class="text-blue-500 text-lg font-bold">$499</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>

          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-4.png" alt="HTC 10 White" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">HTC 10 - White</h2>
              <p class="text-blue-500 text-lg font-bold">$369</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>

          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-5.png" alt="HTC Desire 626s" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">HTC Desire 626s</h2>
              <p class="text-blue-500 text-lg font-bold">$249</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>

          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-6.png" alt="Vintage iPhone" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">Vintage iPhone</h2>
              <p class="text-blue-500 text-lg font-bold">$799</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>

          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-7.png" alt="iPhone 7" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">iPhone 7</h2>
              <p class="text-blue-500 text-lg font-bold">$899</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>

          <div class="bg-white rounded-lg shadow-md overflow-hidden p-4 text-center">
              <img src="https://phone-shop.netlify.app/img/product-8.png" alt="Smashed iPhone" class="images w-full h-40 object-contain mb-3">
              <div class="flex justify-between">
                <h2 class="text-lg font-semibold">Smashed iPhone</h2>
              <p class="text-blue-500 text-lg font-bold">$199</p>
              </div>
              <button class="buy bg-green-400 px-2 py-1 rounded text-white mt-1">Buy</button>
          </div>
      </div>
  </div>

  <div id="productModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3 relative h-[400px] flex flex-col items-center justify-evenly">
      <h5>Item Added To Cart</h5>
        <img id="modalImage" width="150" class="object-cover rounded-md" src="" alt="Product Image">
        <h3 id="modalTitle" class="text-xl font-semibold"></h3>
        <p id="modalPrice" class="text-gray-700 "></p>
        <div class="flex justify-center gap-4 mt-4">
            <button class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 store">Store</button>
            <button class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 goCart">Go To Cart</button>
        </div>
    </div>
</div>
  </body>
  <script src="/dist/index.js" type="module"></script>
</html>
